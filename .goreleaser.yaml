version: 2

builds:
  - id: ergo
    main: ./cmd/ergo
    binary: ergo
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: ergo
    homepage: https://github.com/sandover/ergo
    description: Local, dependency-aware backlog for coding agents
    license: MIT
    binaries:
      - ergo
    repository:
      owner: sandover
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ergo"]
          end

winget:
  - name: ergo
    publisher: Sandover
    package_identifier: Sandover.Ergo
    short_description: Local, dependency-aware backlog for coding agents
    license: MIT
    publisher_url: https://github.com/sandover
    publisher_support_url: https://github.com/sandover/ergo/issues
    homepage: https://github.com/sandover/ergo
    description: >-
      Ergo is a fast, minimal, dependency-aware backlog for coding agents.
      It stores a readable task graph and shared journal in git-friendly JSONL.
    tags:
      - backlog
      - cli
      - coding-agents
      - golang
    ids:
      - default
    url_template: https://github.com/sandover/ergo/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    skip_upload: '{{ if isEnvSet "WINGET_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: sandover
      name: winget-pkgs
      branch: "{{ .ProjectName }}-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
